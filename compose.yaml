services:
  juice-shop:
    image: juice-shop:local
    container_name: juice-shop
    restart: unless-stopped
    expose: ["3000"]

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - juice-shop

  mongodb:
    image: mongo:8
    container_name: mongodb-container
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
